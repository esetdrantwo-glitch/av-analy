name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build EXE
        run: python -m PyInstaller --onefile --windowed --name AV-EDR-Analyzer main.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: AV-EDR-Analyzer-windows-exe
          path: dist/AV-EDR-Analyzer.exe
